# RiftProbe — Render Blueprint
# Deploys the demo API that powers the Vercel-hosted frontend.
#
# IMPORTANT: This service MUST use Docker runtime, not native Python.
# If you see "pip install -r requirements.txt" in build logs, the service
# was created with the wrong runtime — see docs/DEPLOYMENT.md § Troubleshooting.
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → connect repo
#   3. Apply blueprint (creates riftprobe-api web service)
#   4. Set custom domain: api.riftprobe.venkatkolasani.in (optional)
#   5. In Vercel, set NEXT_PUBLIC_API_URL to the Render service URL

services:
  - type: web
    name: riftprobe-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: /app
